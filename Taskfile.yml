# https://taskfile.dev
#
# Sync the local `workspace/` tree to the pwn.college dojo so that the
# `dojotool` package is importable as `from dojotool import find_challenge` and
# `from dojotool.pwntool import tee`
# under the user `hacker` on the dojo.
#
#   task sync

version: "3"

# Task loads the local token into the environment for scripts/task_init.py;
# the token itself remains in the ignored .env file rather than this file.
dotenv: [".env"]

vars:
  DOJO_HOST: hacker@dojo.pwn.college
  HACKER_SRC: workspace/home/hacker
  # The PATH-resolved `ssh.exe` (C:\Program Files\OpenSSH) is incompatible with
  # the mingw `rsync.exe` shim; pin to the matching msys64 ssh so the rsync
  # protocol handshake succeeds.
  RSYNC_SSH: /usr/bin/ssh

tasks:
  sync:
    desc: Sync workspace/home/hacker -> ~ on {{.DOJO_HOST}}
    cmds:
      - rsync -av -e "{{.RSYNC_SSH}}"
        --exclude='__pycache__/' 
        "{{.HACKER_SRC}}/" "{{.DOJO_HOST}}:./"

  init:
    desc: Initialize a solution from the running challenge via the pwn.college API
    summary: |
      Usage: task init
             task init extension=c
    vars:
      extension: '{{default "py" .extension}}'
    cmds:
      - uv run python scripts/task_init.py "{{.extension}}"

  submit:
    desc: Run the solution for the running challenge
    summary: |
      Usage: task submit                  # forwards --recursive by default
             task submit -- --upload-only # any extra dojo.py flag
    cmds:
      - uv run python scripts/task_submit.py -r {{.CLI_ARGS}}

  commit:
    desc: Commit changes for the running challenge
    cmds:
      - uv run python scripts/task_commit.py

  test:
    desc: Run the task helper tests
    cmds:
      - uv run python -m unittest discover tests

  pull:
    desc: Download challenge file to local
    summary: |
      Usage: task pull
             task pull destination=/path/to/directory
    vars:
      destination: '{{default "./" .destination}}'
    cmds:
      # pull content inside `/challenge/`
      # - rsync -avzP -e "{{.RSYNC_SSH}}" "{{.DOJO_HOST}}:/challenge/" "{{.destination}}"
      - scp -r {{.DOJO_HOST}}:/challenge/* "{{.destination}}"

  ida:
    desc: Download the challenge binary to a temporary directory and open it in IDA
    vars:
      TEMP_DIR:
        sh: mktemp --tmpdir "$TEMP" -d
    cmds:
      - task: pull
        vars:
          destination: "{{.TEMP_DIR}}"
      - for file in $(find "{{.TEMP_DIR}}" -type f); do ida "$file"; done

  dojotool-pth:
    desc: Drop a .pth file so `import dojotool` resolves inside the uv venv
    vars:
      PTH_DIR: .venv/Lib/site-packages
      MOD_DIR: workspace/home/hacker/.local/lib/python3.13/site-packages
      EXTRA_DIRS:
        - workspace/home/hacker/.local/lib/python3.13/site-packages
        - scripts
    cmds:
      - |
        {
        {{- range .EXTRA_DIRS }}
          printf '%s\n' "{{ relPath $.PTH_DIR . | toSlash }}"
        {{- end }}
        } > "{{.PTH_DIR}}/dojotool.pth"
