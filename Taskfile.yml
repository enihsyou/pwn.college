# https://taskfile.dev
#
# Sync the local `workspace/` tree to the pwn.college dojo so that the
# `dojotool` package is importable as `from dojotool import tee, find_challenge`
# under the user `hacker` on the dojo.
#
#   task sync

version: "3"

vars:
  DOJO_HOST: hacker@dojo.pwn.college
  HACKER_SRC: workspace/home/hacker
  # The PATH-resolved `ssh.exe` (C:\Program Files\OpenSSH) is incompatible with
  # the mingw `rsync.exe` shim; pin to the matching msys64 ssh so the rsync
  # protocol handshake succeeds.
  RSYNC_SSH: /usr/bin/ssh

tasks:
  sync:
    desc: Sync workspace/home/hacker -> ~ on {{.DOJO_HOST}}
    cmds:
      - rsync -av -e "{{.RSYNC_SSH}}" "{{.HACKER_SRC}}/" "{{.DOJO_HOST}}:./"

  init:
    desc: Initialize the dojo solution file from running challenge
    vars:
      # This value cannot be obtained, hardcoded for now
      DOJO: program-security
    cmds:
      - |
        hostname=$(ssh -q {{.DOJO_HOST}} hostname)
        dojo="{{.DOJO}}"
        module="${hostname%%~*}"
        challenge="${hostname##*~}"
        challenge="${challenge%-easy}"
        challenge="${challenge%-hard}"
        # -b will make sed output LF instead of CRLF on Windows
        title=$(echo "${challenge}" | sed -bE 's/-/ /g; s/\b[a-z]/\u&/g')
        printf "Init challenge: %s\n" "${title}"

        folder="challenges/legacy/${dojo}/${module}/${challenge}"
        flagpy="${folder}/flag.py"
        if [ ! -f "${flagpy}" ]; then
          mkdir -p "${folder}"
          echo "# ${title}" > "${flagpy}"
          cat >> "${flagpy}" << 'EOF'
        import pwn
        from dojotool import tee, find_challenge


        def one_round(io: pwn.process) -> None:
            pass


        def ctf() -> None:
            root_bin = find_challenge()
            with pwn.process(root_bin, raw=True, level="error") as io:
                tee(io)
                try:
                    one_round(io)
                    io.recvrepeat()
                except Exception:
                    io.recvrepeat(0.5)
                    raise


        if __name__ == "__main__":
            ctf()
        EOF
        fi
        printf "Challenge at: %s\n" "${flagpy}"