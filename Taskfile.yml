# https://taskfile.dev
#
# Sync the local `workspace/` tree to the pwn.college dojo so that the
# `dojotool` package is importable as `from dojotool import tee, find_challenge`
# under the user `hacker` on the dojo.
#
#   task sync

version: "3"

# Task loads the local token into the environment for scripts/task_init.py;
# the token itself remains in the ignored .env file rather than this file.
dotenv: [".env"]

vars:
  DOJO_HOST: hacker@dojo.pwn.college
  HACKER_SRC: workspace/home/hacker
  # The PATH-resolved `ssh.exe` (C:\Program Files\OpenSSH) is incompatible with
  # the mingw `rsync.exe` shim; pin to the matching msys64 ssh so the rsync
  # protocol handshake succeeds.
  RSYNC_SSH: /usr/bin/ssh

tasks:
  sync:
    desc: Sync workspace/home/hacker -> ~ on {{.DOJO_HOST}}
    cmds:
      - rsync -av -e "{{.RSYNC_SSH}}"
        --exclude='__pycache__/' 
        "{{.HACKER_SRC}}/" "{{.DOJO_HOST}}:./"

  init:
    desc: Initialize a solution from the running challenge via the pwn.college API
    summary: |
      Usage: task init extension=py
    vars:
      extension: '{{default "py" .extension}}'
    cmds:
      - uv run python scripts/task_init.py "{{.extension}}"

  submit:
    desc: Run the Python solution for the running challenge
    cmds:
      - uv run python scripts/task_submit.py

  test:
    desc: Run the task initialization and submission tests
    cmds:
      - uv run python -m unittest tests/test_task_init.py tests/test_task_submit.py

  pull:
    desc: Download challenge file to local
    cmds:
      # pull content inside `/challenge/`
      # - rsync -avzP -e "{{.RSYNC_SSH}}" "{{.DOJO_HOST}}:/challenge/" .
      - scp {{.DOJO_HOST}}:/challenge/* ./

  dojotool-pth:
    desc: Drop a .pth file so `import dojotool` resolves inside the uv venv
    vars:
      PTH_DIR: .venv/Lib/site-packages
      MOD_DIR: workspace/home/hacker/.local/lib/python3.13/site-packages
      EXTRA_DIRS:
        - workspace/home/hacker/.local/lib/python3.13/site-packages
        - scripts
    cmds:
      - |
        {
        {{- range .EXTRA_DIRS }}
          printf '%s\n' "{{ relPath $.PTH_DIR . | toSlash }}"
        {{- end }}
        } > "{{.PTH_DIR}}/dojotool.pth"